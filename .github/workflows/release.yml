name: Release

# Sürüm etiketi (ör. v0.1.0-beta.1) push edilince iki paketi derler, test eder ve npm'e yayınlar
# (KK-10, FRD §11.3). Kimlik: npm Trusted Publishing (GitHub OIDC). Belirteç ya da 2FA kodu gerekmez;
# provenance imzası otomatik eklenir. npmjs.com'da her iki paketin Trusted Publisher ayarı:
# depo yasinilkalp/flashback, iş akışı release.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Yalnızca dene (npm publish --dry-run)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Trusted Publishing ve provenance için GitHub OIDC kimliği

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing npm 11.5.1 ve üstünü ister; Node 22 ile gelen npm daha eski.
      - run: npm install -g npm@11
      - run: npm --version

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      - name: Sürümleri denetle
        id: version
        shell: bash
        run: |
          set -euo pipefail
          devtools=$(node -p "require('./packages/flashback/package.json').version")
          mcp=$(node -p "require('./packages/mcp/package.json').version")
          if [ "$devtools" != "$mcp" ]; then
            echo "::error::Paket sürümleri farklı: flashback-devtools $devtools, flashback-mcp $mcp"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$devtools" ]; then
            echo "::error::Etiket ${GITHUB_REF_NAME}, paket sürümü v$devtools ile uyuşmuyor"; exit 1
          fi
          # Ön sürümler (0.1.0-beta.1) 'beta' etiketiyle, diğerleri 'latest' ile yayınlanır.
          if [[ "$devtools" == *-* ]]; then tag=beta; else tag=latest; fi
          echo "version=$devtools" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Sürüm $devtools, npm etiketi $tag"

      - name: Bu sürüm npm'de var mı
        id: exists
        shell: bash
        run: |
          set -uo pipefail
          v="${{ steps.version.outputs.version }}"
          for p in flashback-devtools flashback-mcp; do
            if npm view "$p@$v" version >/dev/null 2>&1; then
              echo "::error::$p@$v npm'de zaten var. Yeni sürüm için iki paketin sürümünü artırıp yeni etiket gönderin."
              exit 1
            fi
          done
          echo "$v henüz yayınlanmamış."

      - name: Paket içeriği
        run: npm pack --dry-run -w flashback-devtools -w flashback-mcp

      - name: Yayınla
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish -w flashback-devtools -w flashback-mcp --access public --tag ${{ steps.version.outputs.tag }}

      - name: Yayınla (deneme)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish -w flashback-devtools -w flashback-mcp --dry-run --access public --tag ${{ steps.version.outputs.tag }}

      - name: Yayını doğrula
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          for p in flashback-devtools flashback-mcp; do
            for i in 1 2 3 4 5 6; do
              if npm view "$p@$v" version >/dev/null 2>&1; then echo "$p@$v npm'de."; continue 2; fi
              sleep 10
            done
            echo "::error::$p@$v yayından sonra npm'de görünmüyor"; exit 1
          done
