name: Release

# main'e gelen her push'ta paket sürümüne bakar. Sürüm npm'de yoksa aynı commit'in CI'ı geçene kadar bekler, iki
# paketi derler, test eder, npm'e yayınlar ve v<sürüm> etiketiyle bir GitHub sürümü açar (KK-10, FRD §11.3).
# Sürüm artırma: `npm run release:bump -- beta` (README → Yayımlama). Sürüm npm'deyse iş hemen biter.
# Kimlik: npm Trusted Publishing (GitHub OIDC). Belirteç ya da 2FA kodu gerekmez; provenance imzası otomatik
# eklenir. npmjs.com'da her iki paketin Trusted Publisher ayarı: depo yasinilkalp/flashback, iş akışı release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Yalnızca dene (npm publish --dry-run)'
        type: boolean
        default: true

permissions:
  contents: write # v<sürüm> etiketi ve GitHub sürümü
  actions: read # aynı commit'in CI sonucunu okumak için
  id-token: write # Trusted Publishing ve provenance için GitHub OIDC kimliği

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Sürümleri denetle
        id: version
        shell: bash
        run: |
          set -euo pipefail
          devtools=$(node -p "require('./packages/flashback/package.json').version")
          mcp=$(node -p "require('./packages/mcp/package.json').version")
          if [ "$devtools" != "$mcp" ]; then
            echo "::error::Paket sürümleri farklı: flashback-devtools $devtools, flashback-mcp $mcp"; exit 1
          fi
          # Gerçek yayın: main'e push ya da dry_run kapalı elle çalıştırma. Yalnızca main'den yayınlanır.
          real=false
          if [ "${{ github.event_name }}" = push ] || [ "${{ inputs.dry_run }}" = false ]; then real=true; fi
          if [ "$real" = true ] && [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error::Gerçek yayın yalnızca main'den yapılır (şu an ${GITHUB_REF})"; exit 1
          fi
          echo "version=$devtools" >> "$GITHUB_OUTPUT"
          echo "real=$real" >> "$GITHUB_OUTPUT"
          echo "Sürüm $devtools, gerçek yayın: $real"

      - name: Bu sürüm npm'de var mı
        id: exists
        shell: bash
        run: |
          set -uo pipefail
          v="${{ steps.version.outputs.version }}"
          missing=""
          for p in flashback-devtools flashback-mcp; do
            if npm view "$p@$v" version >/dev/null 2>&1; then echo "$p@$v npm'de."; else missing="$missing $p"; fi
          done
          missing="${missing# }"
          if [ -z "$missing" ]; then
            echo "$v iki pakette de npm'de; yayınlanacak bir şey yok. Yeni sürüm için: npm run release:bump -- beta"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            # Önceki koşu yayınlayıp sürümü açamadan bittiyse GitHub sürümü yine açılır.
            if ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$v GitHub sürümü yok; açılacak."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # Yarım kalmış bir yayından sonra yalnızca eksik paket yayınlanır.
            echo "Yayınlanacak: $missing@$v"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "packages=$missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Bu commit'in CI'ını bekle
        if: steps.exists.outputs.publish == 'true' && steps.version.outputs.real == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # ci.yml aynı push'la başlar (üç işletim sisteminde e2e, ~15 dk). Yalnızca başarılıysa yayınlanır.
          for i in $(seq 1 140); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -n "$run" ]; then
              status=$(jq -r .status <<<"$run")
              conclusion=$(jq -r .conclusion <<<"$run")
              url=$(jq -r .url <<<"$run")
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then echo "CI geçti: $url"; exit 0; fi
                echo "::error::CI başarısız ($conclusion), yayın yapılmadı: $url"; exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::CI 70 dakikada bitmedi; yayın yapılmadı"; exit 1

      # Trusted Publishing npm 11.5.1 ve üstünü ister; Node 22 ile gelen npm daha eski.
      - if: steps.exists.outputs.publish == 'true'
        run: npm install -g npm@11
      - if: steps.exists.outputs.publish == 'true'
        run: npm --version

      - if: steps.exists.outputs.publish == 'true'
        run: npm ci
      - if: steps.exists.outputs.publish == 'true'
        run: npm run build
      - if: steps.exists.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.exists.outputs.publish == 'true'
        run: npm test

      - name: Paket içeriği
        if: steps.exists.outputs.publish == 'true'
        run: npm pack --dry-run -w flashback-devtools -w flashback-mcp

      # Kararlı 1.0'a kadar ön sürümler de 'latest' ile çıkar: belgelerdeki `npm i -D flashback-devtools`
      # her zaman en yeni sürümü kurar.
      - name: Yayınla
        if: steps.exists.outputs.publish == 'true' && steps.version.outputs.real == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for p in ${{ steps.exists.outputs.packages }}; do
            npm publish -w "$p" --access public --tag latest
          done

      - name: Yayınla (deneme)
        if: steps.exists.outputs.publish == 'true' && steps.version.outputs.real != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for p in ${{ steps.exists.outputs.packages }}; do
            npm publish -w "$p" --dry-run --access public --tag latest
          done

      - name: Yayını doğrula
        if: steps.exists.outputs.publish == 'true' && steps.version.outputs.real == 'true'
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          # npm yeni sürümü birkaç dakika işler ("being processed"); 15 dakikaya kadar beklenir.
          for p in flashback-devtools flashback-mcp; do
            for i in $(seq 1 90); do
              if npm view "$p@$v" version >/dev/null 2>&1; then echo "$p@$v npm'de."; continue 2; fi
              sleep 10
            done
            echo "::error::$p@$v yayından 15 dakika sonra npm'de görünmüyor"; exit 1
          done

      - name: Etiket ve GitHub sürümü
        if: (steps.exists.outputs.publish == 'true' || steps.exists.outputs.release == 'true') && steps.version.outputs.real == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag sürümü zaten var."; exit 0
          fi
          pre=()
          if [[ "$tag" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes "${pre[@]}"
