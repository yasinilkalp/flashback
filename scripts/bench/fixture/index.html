<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashback bench — 5.000 düğümlü liste</title>
    <style>
      body { font: 13px/1.3 system-ui, sans-serif; margin: 0; }
      header { position: sticky; top: 0; background: #fff; padding: 8px; border-bottom: 1px solid #ccc; display: flex; gap: 8px; align-items: center; z-index: 1; }
